name: Documentation

# Automated documentation build paused for now — manual trigger only
on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url="https://github.com/SouKot/SimCore.jl.git"),
              PackageSpec(path=pwd())
            ])
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
